[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Anthony14FR/Context-Wizard"
publish = false

[workspace.dependencies]
wizard-budget = { path = "crates/wizard-budget" }
wizard-core = { path = "crates/wizard-core" }
wizard-index = { path = "crates/wizard-index" }
wizard-parse = { path = "crates/wizard-parse" }
wizard-scan = { path = "crates/wizard-scan" }
wizard-store = { path = "crates/wizard-store" }
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.33"
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
streaming-iterator = "0.1.9"
tempfile = "3.27.0"
tree-sitter = "0.27.1"
tree-sitter-language-pack = "=1.22.1"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
