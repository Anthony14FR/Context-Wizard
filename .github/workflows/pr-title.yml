name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            test
            docs
            build
            ci
            chore
          scopes: |
            core
            adr
            scan
            parse
            graph
            budget
            git
            learn
            recipes
            store
            index
            mcp
            cli
            hooks
            plugin
            install
            release
            bench
            ci
            docs
            deps
          requireScope: false
          subjectPattern: ^(?![A-Z])(?=.{1,72}$).*[^.]$
          subjectPatternError: The subject must start with a lowercase letter, have at most 72 characters and not end with a period.
