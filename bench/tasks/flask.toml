prompt = "Add a new blinker signal named request_aborted (\"request-aborted\") next to the other signals, and export it from the top-level flask package like the other signals."
check = "grep -q request_aborted src/flask/signals.py && grep -q request_aborted src/flask/__init__.py"

[[task]]
id = "flask-09"
kind = "edit"
prompt = "Add a new default config key MAX_JSON_BODY_SIZE set to None in the Flask app's default config, and document it in the configuration docs."
check = "grep -q MAX_JSON_BODY_SIZE src/flask/app.py && grep -q MAX_JSON_BODY_SIZE docs/config.rst"

[[task]]
