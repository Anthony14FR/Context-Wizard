[repository]
name = "flask"
url = "https://github.com/pallets/flask"
sha = "d086db856be187255b8ec61ef409357393020f32"
stack = "Python"

[[task]]
id = "flask-01"
kind = "locate"
prompt = "A view stores a value for the current visitor (for example a datetime or a tuple) and it is still there on their next request, kept as a signed value in the browser rather than on the server. Trace this end to end: where the stored data is loaded lazily once a request begins, where it is written back onto the outgoing response, where the signing happens, and where non-standard Python types are encoded so they round-trip intact. List the repository-relative paths of the files involved."
answer_contains = ["src/flask/ctx.py", "src/flask/app.py", "src/flask/sessions.py", "src/flask/json/tag.py"]

[[task]]
id = "flask-02"
kind = "locate"
prompt = "A modular component registered on the application ships its own folder of HTML page files, and rendering a page by name falls back to that folder when the application's own folder does not have it. Trace how: where the rendering engine's environment is created and given its global file lookup, where that lookup walks the application and then every registered component, and where each one's folder-based lookup is built from its root path. List the repository-relative paths of the files involved."
answer_contains = ["src/flask/app.py", "src/flask/sansio/app.py", "src/flask/templating.py", "src/flask/sansio/scaffold.py"]

[[task]]
id = "flask-03"
kind = "locate"
prompt = "Calling the method that starts the built-in development server directly on the application object from a script does several things before serving: it does nothing if the process was launched by the project's own terminal command, loads environment files from the project directory unless told not to, re-reads the debug environment variable, and prints a startup banner. Trace where each of those steps is implemented. List the repository-relative paths of the files involved."
answer_contains = ["src/flask/app.py", "src/flask/cli.py", "src/flask/helpers.py"]

[[task]]
id = "flask-04"
kind = "locate"
prompt = "Requests whose body exceeds a configured size are rejected with 413 Payload Too Large. Trace where the default value of that limit is declared, where the incoming request object is constructed from the WSGI environment for each request, and where that object reads the configured limit while still allowing a per-request override. List the repository-relative paths of the files involved."
answer_contains = ["src/flask/app.py", "src/flask/ctx.py", "src/flask/wrappers.py"]

[[task]]
id = "flask-05"
kind = "locate"
prompt = "A modular component registers a custom handler for 404 responses, and a view inside it stops early with a 404 status. Trace the flow: the public function the view calls to stop, where the raised HTTP error is caught during dispatch, how the matching handler is chosen (component-specific before application-wide, status code before exception class), where handlers are recorded when they are declared, and where the component's handlers are copied into the application when the component is registered. List the repository-relative paths of the files involved."
answer_contains = ["src/flask/helpers.py", "src/flask/app.py", "src/flask/sansio/app.py", "src/flask/sansio/scaffold.py", "src/flask/sansio/blueprints.py"]

[[task]]
id = "flask-06"
kind = "locate"
prompt = "When a view returns a plain Python dict or list, the client receives a serialized API response, and dates or dataclass instances inside it are converted automatically. Trace where the view's return value is converted, which object performs the serialization and builds the response (including the fallback for dates and dataclasses), and where that object is created and attached to the application. List the repository-relative paths of the files involved."
answer_contains = ["src/flask/app.py", "src/flask/json/provider.py", "src/flask/sansio/app.py"]

[[task]]
id = "flask-07"
kind = "locate"
prompt = "Extensions can subscribe to notifications that fire when request handling begins, right after a page has been rendered, and when a one-time message is queued for the user's next page. Find where those notification objects are declared and where each of them is emitted. List the repository-relative paths of the files involved."
answer_contains = ["src/flask/signals.py", "src/flask/app.py", "src/flask/templating.py", "src/flask/helpers.py"]

[[task]]
id = "flask-08"
kind = "edit"
prompt = "Add a new notification named response_finalized that subscribers can listen to, emitted with the final response once the post-request processing of a response has completed. Declare it alongside the existing ones and make it importable from the top-level package like them."
check = "grep -q response_finalized src/flask/signals.py && grep -q response_finalized src/flask/__init__.py && grep -q 'response_finalized.send' src/flask/app.py"

[[task]]
id = "flask-09"
kind = "edit"
prompt = "Add a configuration setting TEMPLATES_STRICT_UNDEFINED, defaulting to False. When it is True, the rendering environment must raise an error on undefined variables instead of rendering them as empty (use the engine's strict undefined type). Document the setting with the other built-in configuration values."
check = "grep -q TEMPLATES_STRICT_UNDEFINED src/flask/app.py && grep -rq StrictUndefined src/flask && grep -q TEMPLATES_STRICT_UNDEFINED docs/config.rst"

[[task]]
id = "flask-10"
kind = "edit"
prompt = "Make the salt used to sign the visitor's browser-stored data configurable through a new configuration setting SESSION_COOKIE_SALT, whose default keeps the current salt value. The signing code must read the setting from the application's config. Document the setting with the other built-in configuration values."
check = "grep -q SESSION_COOKIE_SALT src/flask/app.py && grep -q SESSION_COOKIE_SALT src/flask/sessions.py && grep -q SESSION_COOKIE_SALT docs/config.rst"
